name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test

  build-binary:
    needs: unit-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build:sea
      - uses: actions/upload-artifact@v4
        with:
          name: ccg-windows-x64
          path: ccg.exe
